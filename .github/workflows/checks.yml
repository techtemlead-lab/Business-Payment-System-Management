name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: dealer_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dealer_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_USERNAME: postgres
      DB_PASSWORD: isolated-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pdo_sqlite, mbstring, intl, pcntl
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@12.2.0
      - run: composer install --prefer-dist --no-interaction
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: cp .env.example .env
      - run: php artisan key:generate --no-interaction
      - run: php vendor/bin/phpunit --exclude-group pgsql
      - run: php vendor/bin/phpunit --group pgsql
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: dealer_tests
      - run: npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USERNAME" -d postgres -c 'CREATE DATABASE dealer_browser'
          CHROMIUM_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')" npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
