name: Deploy production

# Merging into main no longer deploys (user's decision, 2026-11-27). A release is a deliberate step:
#   git push origin <green main commit>:production
# The job deploys only a commit that is on main and whose "Application quality" run on main succeeded,
# so the production branch can never carry code that skipped review or tests.
on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      sha:
        description: "Optional green main commit SHA to deploy (defaults to the production branch head)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/production'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Pick the commit and check it is a green main commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SHA:-}" ]; then
            target_sha="$(git rev-parse "$INPUT_SHA^{commit}")"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            target_sha="$(git rev-parse origin/production)"
          else
            target_sha="$GITHUB_SHA"
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$target_sha" origin/main; then
            echo "Refusing to deploy $target_sha: it is not on main." >&2
            exit 1
          fi
          green="$(gh api "repos/$REPOSITORY/actions/workflows/quality.yml/runs?head_sha=$target_sha&branch=main&event=push&status=success" --jq '.total_count')"
          if [ "${green:-0}" -lt 1 ]; then
            echo "Refusing to deploy $target_sha: no successful 'Application quality' run on main for it." >&2
            exit 1
          fi
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "Deploying commit: $target_sha"

      - name: Configure SSH
        env:
          DEPLOY_SSH_TARGET: ${{ secrets.DEPLOY_SSH_TARGET }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_SSH_TARGET" ] || { echo "Missing secret: DEPLOY_SSH_TARGET" >&2; exit 1; }
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "Missing secret: DEPLOY_SSH_KEY" >&2; exit 1; }
          [ -n "$DEPLOY_SSH_KNOWN_HOSTS" ] || { echo "Missing secret: DEPLOY_SSH_KNOWN_HOSTS" >&2; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking yes
            BatchMode yes
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 10m
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy the green commit
        env:
          MADINA_DEPLOY_SSH: ${{ secrets.DEPLOY_SSH_TARGET }}
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          MADINA_DEPLOY_KEY="$HOME/.ssh/deploy_key" bash infra/deploy/deploy.sh "$TARGET_SHA"

      - name: Clean up SSH key
        if: always()
        run: |
          for sock in ~/.ssh/cm-*; do
            [ -S "$sock" ] && ssh -O exit -S "$sock" placeholder >/dev/null 2>&1 || true
          done
          rm -rf ~/.ssh/deploy_key ~/.ssh/cm-*
