name: Application quality
on:
  push:
    branches: [main, "codex/**", "xai-cursore/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: madina_testing
          POSTGRES_USER: madina_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U madina_test -d madina_testing"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: madina_testing
      DB_USERNAME: madina_test
      DB_PASSWORD: isolated-ci-only
      MADINA_PREVIEW_MODE: "false"
      MADINA_FINANCIAL_ACTIVATION: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: bcmath, gd, intl, mbstring, pdo_pgsql, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: composer audit --locked
      - run: vendor/bin/pint --test
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: cp .env.example .env && php artisan key:generate --no-interaction
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node --test tests/Unit/*.test.mjs
      - run: npm run build
      - run: php artisan test --compact --log-junit storage/test-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: phpunit-junit
          path: storage/test-results.xml
          if-no-files-found: ignore

  production-images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --file Dockerfile.production --target app --tag madina-application:ci .
      - run: docker build --file Dockerfile.production --target web --tag madina-web:ci .

