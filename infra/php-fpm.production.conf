; PHP-FPM pool for the production app container (loaded after the image's www.conf and zz-docker.conf).
; The image default is a fixed 5 workers: one slow phone downloading a video held a fifth of the site.
; Sizing: a request uses about 60-120 MB (memory_limit 512M is only the ceiling). 20 workers fit in about
; 2.4 GB at the worst case on the shared 6 GB VPS; raise pm.max_children only after checking `free -m`.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 8
; Recycle a worker after 500 requests so a slow memory leak in any library cannot grow without end.
pm.max_requests = 500
; A request stuck longer than nginx waits (fastcgi_read_timeout 150s) is ended instead of holding a worker.
request_terminate_timeout = 150s
