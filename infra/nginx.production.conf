# Reflect same-site portal origins for /build/ modules (L2). Replace example.com with APP_DOMAIN.
map $http_origin $madina_cors_origin {
    default "";
    "~^https://([a-z0-9-]+\.)?example\.com$" $http_origin;
    "~^http://([a-z0-9-]+\.)?localhost(:\d+)?$" $http_origin;
}

server {
    listen 80;
    # Replace example.com with APP_DOMAIN. One app root serves the public site and every portal.
    server_name example.com dealer.example.com subdealer.example.com manage.example.com sadmin.example.com _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 112m;
    server_tokens off;
    # Prefer fail2ban/WAF on the TLS terminator for sshd + nginx 4xx/5xx (M8).

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";
        # Host TLS terminator sets X-Forwarded-Proto/For. Do not forward empty
        # X-Forwarded-Host/Port — TrustProxies=* would replace Host with blank and 400.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        # Production web is always behind a TLS terminator (compose binds 127.0.0.1 only).
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 150s;
    }
    location ~ \.php$ {
        return 404;
    }
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # ES module scripts are loaded cross-subdomain when ASSET_URL points at the apex host.
        # Reflect only same-registrable-domain portal origins (not *).
        add_header Access-Control-Allow-Origin $madina_cors_origin always;
        add_header Vary "Origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }
}

