# Madina Natural Health Care — client preview
upstream madina_nhac_web {
    server 127.0.0.1:8095;
    keepalive 8;
}

# Detect Facebook/WhatsApp/Telegram/etc. so we can serve a cookie-free OG shell.
map $http_user_agent $madina_social_crawler {
    default 0;
    ~*(?:facebookexternalhit|Facebot|meta-externalagent|MetaInspector|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|Discordbot|Pinterest|Applebot) 1;
}

# Reflect same-site portal origins for /build/ modules (L2) — not wildcard *.
map $http_origin $madina_cors_origin {
    default "";
    "~^https://([a-z0-9-]+\.)?modinanhac\.techteamlead\.com$" $http_origin;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name modinanhac.techteamlead.com
                dealer.modinanhac.techteamlead.com
                subdealer.modinanhac.techteamlead.com
                manage.modinanhac.techteamlead.com
                sadmin.modinanhac.techteamlead.com;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/madina-nhac/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Public marketing site — crawlers must read OG meta for share cards.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name modinanhac.techteamlead.com;

    ssl_certificate /etc/letsencrypt/live/modinanhac.techteamlead.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modinanhac.techteamlead.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 112m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Explicit Facebook allow-list (Debugger asks for this) plus open crawl for others.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: facebookexternalhit\nAllow: /\n\nUser-agent: Facebot\nAllow: /\n\nUser-agent: meta-externalagent\nAllow: /\n\nUser-agent: WhatsApp\nAllow: /\n\nUser-agent: Twitterbot\nAllow: /\n\nUser-agent: TelegramBot\nAllow: /\n\nUser-agent: LinkedInBot\nAllow: /\n\nUser-agent: *\nAllow: /\n";
    }

    # Cookie-free Open Graph shell for social crawlers (avoids Inertia/session noise).
    location = / {
        if ($madina_social_crawler) {
            rewrite ^ /og-share.html last;
        }
        proxy_pass http://madina_nhac_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /og-share.html {
        alias /opt/madina-nhac/public/og-share.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Robots-Tag "all" always;
    }

    location /build/ {
        proxy_pass http://madina_nhac_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $madina_cors_origin always;
        add_header Vary "Origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://madina_nhac_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# Portal hosts stay noindex (private preview dashboards).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dealer.modinanhac.techteamlead.com
                subdealer.modinanhac.techteamlead.com
                manage.modinanhac.techteamlead.com
                sadmin.modinanhac.techteamlead.com;

    ssl_certificate /etc/letsencrypt/live/modinanhac.techteamlead.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modinanhac.techteamlead.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
