# Madina Natural Health Care — client preview
upstream madina_nhac_web {
    server 127.0.0.1:8095;
    keepalive 8;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name modinanhac.techteamlead.com
                dealer.modinanhac.techteamlead.com
                subdealer.modinanhac.techteamlead.com
                manage.modinanhac.techteamlead.com
                sadmin.modinanhac.techteamlead.com;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/madina-nhac/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Public marketing site — crawlers must read OG meta for share cards.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name modinanhac.techteamlead.com;

    ssl_certificate /etc/letsencrypt/live/modinanhac.techteamlead.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modinanhac.techteamlead.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 112m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Public marketing host must stay crawlable so Messenger/WhatsApp/Facebook
    # can fetch Open Graph cards (no X-Robots-Tag / noindex on this vhost).
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    location /build/ {
        proxy_pass http://madina_nhac_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://madina_nhac_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# Portal hosts stay noindex (private preview dashboards).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dealer.modinanhac.techteamlead.com
                subdealer.modinanhac.techteamlead.com
