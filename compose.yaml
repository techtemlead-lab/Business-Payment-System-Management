name: madina
services:
  app:
    build: .
    command: ["php", "-d", "opcache.enable_cli=1", "-d", "upload_max_filesize=100M", "-d", "post_max_size=112M", "-S", "0.0.0.0:8000", "-t", "public", "infra/dev-router.php"]
    ports: ["127.0.0.1:8088:8000"]
    volumes: [".:/var/www/html", "dependencies:/var/www/html/vendor"]
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: madina
      DB_USERNAME: madina
      DB_PASSWORD: local-development-only
      APP_URL: http://localhost:8088
      APP_DOMAIN: localhost
      MAIL_MAILER: smtp
      MAIL_HOST: mail
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: no-reply@madina.example.test
      MAIL_FROM_NAME: Madina Local Preview
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: madina
      POSTGRES_USER: madina
      POSTGRES_PASSWORD: local-development-only
    volumes: ["database:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madina"]
      interval: 5s
      retries: 20
  mail:
    image: axllent/mailpit:v1.30
    ports: ["127.0.0.1:8025:8025"]
volumes:
  database:
  dependencies:
